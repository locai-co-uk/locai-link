site_name: Loc.ai:Link
site_description: High-performance modular edge inference agent
site_url: https://docs.locai.co.uk/link/
repo_url: https://github.com/locai/locai-link
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.expand
    - navigation.indexes
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src] # Critical: Tells mkdocs where your code lives
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 2

nav:
  - Home: index.md
  - API Reference:
      - Main: reference/main.md
      - App: reference/app.md
      - Adapters: reference/adapters.md
      - Components: reference/components.md
      - Pipeline: reference/pipeline.md
      - Configuration: reference/config.md
      - Infrastructure: reference/infra.md
      - Utilities: reference/utils.md
