name: CI pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

env:
  PYTHON_VERSION: "3.11"

jobs:
  # 0. Version bump check (PRs to main only)
  version-bump:
    name: Check Version Bump
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version was bumped
        run: |
          PR_VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          MAIN_VERSION=$(git show origin/main:pyproject.toml | grep '^version' | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          echo "main:   $MAIN_VERSION"
          echo "branch: $PR_VERSION"
          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "❌ Version has not been bumped. Update the version in pyproject.toml before merging."
            exit 1
          fi
          echo "✅ Version bumped: $MAIN_VERSION → $PR_VERSION"

  # 1. Tests (fast, no external binaries needed)
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Install Project
      shell: bash
      run: |
        uv venv
        uv pip install -e ".[dev]"

    - name: Run Tests
      shell: bash
      env:
        DEVICE_MODE: "LOCAL"
      run: |
        uv run pytest tests/

  # 2. Linting
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint Deps
        run: |
          uv venv
          uv pip install ruff

      - name: Check Code
        run: uv run ruff check .

  # 3. Server Smoke Test (downloads model + binary, runs real server)
  smoke-test:
    name: Smoke Test on ${{ matrix.os }}
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Install Project
      shell: bash
      run: |
        uv venv
        uv pip install -e ".[dev,build]"

    - name: Install llama-server and whisper-server
      shell: bash
      run: uv run python manager.py install-deps

    - name: Run Smoke Tests
      shell: bash
      run: |
        uv run pytest -m ci -v -s
