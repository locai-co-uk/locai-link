name: Build and Test Python Agent

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-and-test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest  # Apple Silicon (M1)
            python: "3.11"

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🛠️ Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: 🐍 Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: 📦 Create Venv & Install Dependencies
      shell: bash
      run: |
        # Create virtual environment
        uv venv
        
        # Install project in editable mode WITH dev dependencies
        # This fixes the ModuleNotFoundError and installs pytest
        uv pip install -e ".[dev]"

    - name: 🧪 Run Tests
      shell: bash
      env:
        DEVICE_MODE: "LOCAL"
      run: |
        # Use 'uv run' to automatically execute inside the venv
        uv run pytest

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🛠️ Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Lint Deps
        run: |
          uv venv
          uv pip install ruff

      - name: 🔍 Check Code
        run: uv run ruff check .