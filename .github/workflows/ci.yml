name: CI pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

env:
  PYTHON_VERSION: "3.11"

jobs:
  # 1. Unit Tests (fast, no external binaries needed)
  unit-test:
    name: Unit Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Install Project
      shell: bash
      run: |
        uv venv
        uv pip install -e ".[dev]"

    - name: Run Unit Tests
      shell: bash
      env:
        DEVICE_MODE: "LOCAL"
      # Default addopts already excludes -m "not ci", so only unit tests run
      run: |
        uv run pytest tests/

  # 2. Linting
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint Deps
        run: |
          uv venv
          uv pip install ruff

      - name: Check Code
        run: uv run ruff check .

  # 3. CI Tests (downloads model + binary, runs real server)
  ci-test:
    name: CI Test on ${{ matrix.os }}
    needs: [unit-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Install Project
      shell: bash
      run: |
        uv venv
        uv pip install -e ".[dev]"

    - name: Install llama-server binary
      shell: bash
      run: uv run python manager.py install-deps

    - name: Run CI Tests
      shell: bash
      run: |
        uv run pytest -m ci -v -s
