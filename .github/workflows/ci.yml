name: CI Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
      - "dev"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

# Linux-first gating: the cheap ubuntu legs run first, and the 10x-macOS /
# 2x-Windows legs `needs:` their ubuntu sibling. A failure that reproduces on
# Linux (most of them) skips the expensive runners entirely instead of burning
# their minutes in parallel. GitHub has no per-matrix-entry `needs`, so each
# 3-OS matrix is split into a linux job + a cross-OS job that depends on it.
jobs:
  # Path filter: does this PR touch anything the build/tests care about?
  # Docs, workflow files, licences and images alone → the heavy build/test jobs
  # skip (a job skipped via `if:` reports "skipped", which branch protection
  # treats as success, so required checks stay satisfied). Any other changed
  # file flips `code` true and the full matrix runs. Non-PR events
  # (workflow_dispatch) always run everything.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      # code = any non-docs change (gates the cheap Linux legs).
      # python / rust = which area changed (gates the expensive cross-OS legs).
      code: ${{ steps.filter.outputs.code }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          emit() { { echo "code=$1"; echo "python=$2"; echo "rust=$3"; } >>"$GITHUB_OUTPUT"; }
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "non-PR event — running everything"; emit true true true; exit 0
          fi
          # Fail closed: if change detection errors or finds nothing, run everything.
          if ! FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD") || [ -z "$FILES" ]; then
            echo "path detection failed or empty — running everything"; emit true true true; exit 0
          fi
          echo "changed files:"; echo "$FILES"
          code=false; python=false; rust=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # Workflow changes are code: they gate build/test and must be validated.
              .github/workflows/*) code=true ;;
              *.md|LICENSE*|docs/*|.github/*|*.png|*.jpg|*.jpeg|*.gif|*.svg|*.ico) ;;
              *) code=true ;;
            esac
            case "$f" in
              *.py|main.py|pyproject.toml|plugins/*|src/link/*) python=true ;;
            esac
            case "$f" in
              crates/*|*.rs|*Cargo.toml|Cargo.lock) rust=true ;;
            esac
          done <<< "$FILES"
          # Fail closed: a non-docs change we couldn't categorise runs both.
          if [ "$code" = "true" ] && [ "$python" = "false" ] && [ "$rust" = "false" ]; then
            python=true; rust=true
          fi
          echo "code=$code python=$python rust=$rust"
          emit "$code" "$python" "$rust"

  # 0. Version bump check (PRs to main only). The check step is skipped for
  # Dependabot (dependency bumps legitimately don't touch the app version); the
  # job still succeeds so a required status check stays green.
  version-bump:
    name: Check Version Bump
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version was bumped
        if: github.actor != 'dependabot[bot]'
        run: |
          PR_VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          MAIN_VERSION=$(git show origin/main:pyproject.toml | grep '^version' | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          echo "main:   $MAIN_VERSION"
          echo "branch: $PR_VERSION"
          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "::error::Version has not been bumped. Update the version in pyproject.toml before merging."
            exit 1
          fi
          echo "Version bumped: $MAIN_VERSION -> $PR_VERSION"

      - name: Warn if a plugin binary changed without a tag bumps
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'plugins/*/install.py' || true)
          for f in $CHANGED; do
            new=$(grep -E '_RELEASE[[:space:]]*=[[:space:]]*"' "$f" | sort || true)
            [ -n "$new" ] || continue   # plugin pins no binaries — nothing to bump
            old=$(git show "origin/main:$f" 2>/dev/null | grep -E '_RELEASE[[:space:]]*=[[:space:]]*"' | sort || true)
            if [ "$old" = "$new" ]; then
              echo "::warning file=$f::$f changed but no pinned *_RELEASE tag moved. If the plugin binary changed, bump its pinned tag so devices re-fetch (binary fetch is tag-cached)."
            fi
          done

  # 1. Linting (Fast) — part of the Linux gate the cross-OS unit tests wait on.
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint Deps
        run: |
          uv venv
          uv pip install ruff

      - name: Check Code
        run: uv run ruff check .

  # 2a. Unit tests — Linux gate. Fast, cheapest runner. The macOS/Windows unit
  # tests below only start if this (and lint) pass.
  unit-test-linux:
    name: Unit Test on ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Project
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"
          # Install language_model plugin so tests/test_language_model_server.py can import it.
          # No build step — just the Python package; integration tests live in the plugin dir.
          uv pip install -e "plugins/language_model[dev]"

      - name: Run Unit Tests
        shell: bash
        env:
          DEVICE_MODE: "LOCAL"
        run: |
          uv run pytest tests/ -v

  # 2b. Unit tests — macOS + Windows. Gated on the Linux unit tests + lint.
  unit-test-cross:
    name: Unit Test on ${{ matrix.os }}
    needs: [changes, unit-test-linux, lint]
    # Run the 10x-macOS / 2x-Windows unit legs only when Python changed, and
    # never for Dependabot. UI/rust/docs PRs skip them (nothing Python-facing
    # to validate cross-OS); Python PRs still get full pre-merge coverage.
    if: needs.changes.outputs.python == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Project
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "plugins/language_model[dev]"

      - name: Run Unit Tests
        shell: bash
        env:
          DEVICE_MODE: "LOCAL"
        run: |
          uv run pytest tests/ -v

  # 3a. Rust check + unit tests (headless build) — Linux gate.
  #
  # Headless (`--no-default-features`) links no Tauri, so it `cargo check`s
  # without webkit2gtk / gtk3 / libsoup — cheap on a plain runner, and it
  # exercises the supervisor + folded platform/Control logic (autostart,
  # health probing, install-state reading). The full Tauri app is built
  # end-to-end in the `tauri-build` job below (Linux, --no-bundle), where
  # its compile + frontend breakage is caught.
  rust-check-linux:
    name: Rust Check (headless) on ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Rust job doesn't push or fetch other repos — drop the token
          # so later steps can't inadvertently reach GitHub with write
          # access if a dependency script goes rogue.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target"
          key: ubuntu-latest

      - name: Cargo check
        working-directory: crates
        run: cargo check -p locai-link-companion --no-default-features

      - name: Cargo test
        working-directory: crates
        run: cargo test -p locai-link-companion --no-default-features --lib

  # 3b. Rust crate check + unit tests — macOS + Windows. Gated on the Linux
  # Rust check, so the platform-gated autostart/{macos,windows}.rs modules
  # (via #[cfg(target_os = ...)]) still get compiled on their real OS, but only
  # if the shared logic already passed on Linux.
  rust-check-cross:
    name: Rust Check (headless) on ${{ matrix.os }}
    needs: [changes, rust-check-linux]
    # macOS/Windows compile check for the cfg-gated autostart modules — only
    # when Rust changed (cross-compiling these targets from Linux is blocked by
    # the ring C dep, so a real runner is the cheap-enough option, path-gated).
    if: needs.changes.outputs.rust == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target"
          key: ${{ matrix.os }}

      - name: Cargo check
        working-directory: crates
        run: cargo check -p locai-link-companion --no-default-features

      - name: Cargo test
        working-directory: crates
        run: cargo test -p locai-link-companion --no-default-features --lib

  # 3c. Tauri app build (the single desktop app: tray + first-run setup)
  #
  # The apps were previously only built in the release lane, so a broken app
  # build (Rust error, bad tauri.conf, frontend failure) escaped every PR and
  # only surfaced at release. `tauri build --no-bundle` compiles the Rust
  # binary AND runs the frontend build (also catching a stale embedded UI),
  # while skipping the slow .app/.deb packaging. Linux only: cheapest runner,
  # and the app Rust is platform-shared.
  tauri-build:
    name: Tauri apps build (no-bundle)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tauri system deps
        run: |
          APT_OPTS="-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target"
          key: tauri-build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build companion (no bundle)
        working-directory: crates/companion
        run: |
          npm ci
          npm run tauri build -- --no-bundle

      # The same binary also builds headless (supervisor loop only, no tray).
      # Cheap check on the main gate so a headless-only break fails PR CI, not
      # just the path-gated bundle workflow.
      - name: Check headless supervisor build
        working-directory: crates
        run: cargo check -p locai-link-companion --no-default-features

  # 4a. Integration Tests (Plugins — downloads models and binaries) — Linux gate.
  # `needs: unit-test-linux` so we don't download models on any OS until the
  # fast unit tests pass. The macOS/Windows integration legs below then wait on
  # THIS ubuntu leg, so integration-only breakage that shows on Linux never
  # reaches the expensive runners.
  #
  # NOTE: the steps here and in integration-test-cross are intentionally
  # identical — keep them in sync when editing either.
  integration-test-linux:
    name: Integration Test on ubuntu-latest
    needs: [changes, unit-test-linux]
    # Integration (model downloads + engines) runs only when Python/plugins/
    # runtime changed, and never for Dependabot. Non-Python PRs skip it on all
    # OSes; integration-test-cross cascades off this via needs.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.python == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Deps (Linux)
        run: |
          APT_OPTS="-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y libportaudio2

      - name: Install Project and Plugins
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "plugins/language_model[dev]"
          uv pip install -e "plugins/image_classifier[dev]"
          uv pip install -e "plugins/audio_classifier[dev]"
          uv pip install -e "plugins/audio_transcriber[dev]"

      - name: Cache engine binaries
        uses: actions/cache@v4
        with:
          # Skip re-downloading llama/llama-swap and re-building whisper-server
          # from source on repeat runs. Keyed on the install scripts, which hold
          # the pinned engine tags — a bump invalidates the cache.
          path: |
            .venv/bin-llama
            .venv/bin-whisper
            .venv/build-cache
          key: engines-${{ runner.os }}-${{ hashFiles('plugins/language_model/install.py', 'plugins/audio_transcriber/install.py') }}

      - name: Install Llama Server
        shell: bash
        run: uv run python plugins/language_model/install.py

      - name: Verify llama-swap binary
        shell: bash
        run: |
          VENV_PREFIX="$(uv run python -c 'import sys; print(sys.prefix)')"
          EXPECTED_TAG="$(uv run python -c 'import sys; sys.path.insert(0, "plugins/language_model"); import install; print(install.LLAMA_SWAP_RELEASE)')"
          BIN="$VENV_PREFIX/bin-llama/llama-swap"
          OUT="$("$BIN" --version 2>&1)"
          echo "$OUT"
          # Extract the tag ("version: v239 (sha)…" → "239") and require an
          # exact match, so a wrong build (2390, 239.1, …) can't slip through.
          ACTUAL_TAG="$(printf '%s\n' "$OUT" | sed -nE 's/^version:[[:space:]]*v?([^[:space:]]+).*/\1/p')"
          if [ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::llama-swap version mismatch — expected tag '$EXPECTED_TAG', got: $OUT"
            exit 1
          fi

      - name: Install Whisper Server
        shell: bash
        run: uv run python plugins/audio_transcriber/install.py

      - name: Test Audio Classifier
        shell: bash
        run: uv run pytest plugins/audio_classifier/ -v -s -m ""

      - name: Test Image Classifier
        shell: bash
        run: uv run pytest plugins/image_classifier/ -v -s -m ""

      - name: Test Language Model
        shell: bash
        run: uv run pytest plugins/language_model/ -v -s -m ""

      - name: Test Audio Transcriber
        shell: bash
        run: uv run pytest plugins/audio_transcriber/ -v -s -m ""

  # 4b. Integration Tests — macOS + Windows. Gated on the Linux integration
  # leg above (which is itself gated on the unit tests).
  #
  # NOTE: the steps here and in integration-test-linux are intentionally
  # identical — keep them in sync when editing either.
  integration-test-cross:
    name: Integration Test on ${{ matrix.os }}
    needs: [integration-test-linux]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install System Deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install portaudio

      - name: Install Project and Plugins
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "plugins/language_model[dev]"
          uv pip install -e "plugins/image_classifier[dev]"
          uv pip install -e "plugins/audio_classifier[dev]"
          uv pip install -e "plugins/audio_transcriber[dev]"

      - name: Cache engine binaries
        uses: actions/cache@v4
        with:
          # Skip re-downloading llama/llama-swap and re-building whisper-server
          # from source on repeat runs. Keyed on the install scripts, which hold
          # the pinned engine tags — a bump invalidates the cache.
          path: |
            .venv/bin-llama
            .venv/bin-whisper
            .venv/build-cache
          key: engines-${{ runner.os }}-${{ hashFiles('plugins/language_model/install.py', 'plugins/audio_transcriber/install.py') }}

      - name: Install Llama Server
        shell: bash
        run: uv run python plugins/language_model/install.py

      - name: Verify llama-swap binary
        shell: bash
        run: |
          VENV_PREFIX="$(uv run python -c 'import sys; print(sys.prefix)')"
          EXPECTED_TAG="$(uv run python -c 'import sys; sys.path.insert(0, "plugins/language_model"); import install; print(install.LLAMA_SWAP_RELEASE)')"
          BIN="$VENV_PREFIX/bin-llama/llama-swap"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
          if [ ! -x "$BIN" ] && [ ! -f "$BIN" ]; then
            echo "::error::llama-swap binary missing at $BIN"
            exit 1
          fi
          OUT="$("$BIN" --version 2>&1)"
          echo "$OUT"
          # Extract the tag ("version: v239 (sha)…" → "239") and require an
          # exact match, so a wrong build (2390, 239.1, …) can't slip through.
          ACTUAL_TAG="$(printf '%s\n' "$OUT" | sed -nE 's/^version:[[:space:]]*v?([^[:space:]]+).*/\1/p')"
          if [ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::llama-swap version mismatch — expected tag '$EXPECTED_TAG', got: $OUT"
            exit 1
          fi

      - name: Install Whisper Server
        shell: bash
        run: uv run python plugins/audio_transcriber/install.py

      - name: Test Audio Classifier
        shell: bash
        run: uv run pytest plugins/audio_classifier/ -v -s -m ""

      - name: Test Image Classifier
        shell: bash
        run: uv run pytest plugins/image_classifier/ -v -s -m ""

      - name: Test Language Model
        shell: bash
        run: uv run pytest plugins/language_model/ -v -s -m ""

      - name: Test Audio Transcriber
        shell: bash
        run: uv run pytest plugins/audio_transcriber/ -v -s -m ""
