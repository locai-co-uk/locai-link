#
# THROWAWAY diagnostic — delete after use. Probes the one OTA layer the e2e net
# can't: does the companion's relaunch actually pick up a swapped-on-disk binary?
#
# It can't drive the real Tauri UI, but the failing behaviour is a launchd
# question, not a GUI one: does `launchctl kickstart -k <label>` (exactly what
# updater._restart_ui_app runs) re-exec a KeepAlive LaunchAgent onto a binary
# that was replaced on disk while it was running? A surrogate agent answers that
# on a real macOS runner, and the same run tries bootout+bootstrap as a
# candidate fix so we get a comparative result.
#
# Caveat: a hosted runner's launchd session is not a real user's Aqua/GUI login
# session, so results are indicative, not proof. And the surrogate is a script,
# not a signed .app, so it won't surface a codesign-on-relaunch failure. Read the
# RESULT block in the log.
#
# Run it: push this file on a branch named probe/… (auto-runs) or dispatch it.

name: macOS relaunch probe (throwaway)

on:
  workflow_dispatch:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

jobs:
  probe:
    name: relaunch-on-swap
    runs-on: macos-latest
    steps:
      - name: Environment + launchd domains
        run: |
          set -x
          sw_vers
          whoami
          id -u
          stat -f%u /dev/console || true
          scutil <<< "show State:/Users/ConsoleUser" 2>/dev/null | grep -i name || true
          launchctl print "gui/$(id -u)" 2>&1 | head -3 || echo "gui domain: not available"
          launchctl print "user/$(id -u)" 2>&1 | head -3 || echo "user domain: not available"

      - name: Surrogate relaunch-on-swap experiment
        run: |
          set -uo pipefail
          UID_N="$(id -u)"
          APP="$RUNNER_TEMP/surrogate.sh"
          MARK="$RUNNER_TEMP/marker.txt"
          PLIST="$HOME/Library/LaunchAgents/uk.co.locai.probe.plist"
          LABEL="uk.co.locai.probe"
          mkdir -p "$HOME/Library/LaunchAgents"
          rm -f "$MARK"

          # Write the surrogate "app" at version $1. It records which version is
          # actually running, then stays alive (like the KeepAlive companion).
          write_app() {
            local tmp="$APP.new"
            cat > "$tmp" <<EOF
          #!/bin/bash
          echo "$1 pid=\$\$" > "$MARK"
          exec sleep 3600
          EOF
            chmod 755 "$tmp"
            mv -f "$tmp" "$APP"   # replace-in-place, like the OTA bundle swap
          }

          cat > "$PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>Label</key><string>$LABEL</string>
            <key>ProgramArguments</key><array><string>$APP</string></array>
            <key>RunAtLoad</key><true/>
            <key>KeepAlive</key><dict><key>SuccessfulExit</key><false/></dict>
          </dict></plist>
          EOF

          write_app v1
          DOMAIN="gui/$UID_N"
          launchctl bootstrap "$DOMAIN" "$PLIST" 2>&1 \
            || { DOMAIN="user/$UID_N"; launchctl bootstrap "$DOMAIN" "$PLIST" 2>&1 \
            || echo "bootstrap failed in both gui and user domains"; }
          echo "domain in use: $DOMAIN"
          sleep 3
          echo "after bootstrap: $(cat "$MARK" 2>/dev/null || echo MISSING)"

          # Swap the on-disk binary to v2 while it's running (mimics OTA).
          write_app v2

          echo "--- kickstart -k (the exact prod _restart_ui_app call) ---"
          launchctl kickstart -k "$DOMAIN/$LABEL" 2>&1 || echo "kickstart returned nonzero"
          sleep 3
          KRES="$(cat "$MARK" 2>/dev/null || echo MISSING)"
          echo "after kickstart -k: $KRES"

          # Candidate alternative: fully tear down and re-bootstrap.
          echo "--- bootout + bootstrap (candidate fix) ---"
          launchctl bootout "$DOMAIN/$LABEL" 2>&1 || echo "bootout nonzero"
          sleep 1
          launchctl bootstrap "$DOMAIN" "$PLIST" 2>&1 || echo "re-bootstrap nonzero"
          sleep 3
          BRES="$(cat "$MARK" 2>/dev/null || echo MISSING)"
          echo "after bootout+bootstrap: $BRES"

          echo "=================== RESULT ==================="
          echo "kickstart -k picked up new binary:      $([ "${KRES%% *}" = v2 ] && echo YES || echo "NO ($KRES)")"
          echo "bootout+bootstrap picked up new binary: $([ "${BRES%% *}" = v2 ] && echo YES || echo "NO ($BRES)")"
          echo "============================================="

          launchctl bootout "$DOMAIN/$LABEL" 2>/dev/null || true
          rm -f "$PLIST"
