# SPDX-FileCopyrightText: 2026 Loc.ai Ltd.
# SPDX-License-Identifier: CC0-1.0
#
# End-to-end: the whole lifecycle we have no human tester for — install,
# update, reinstall, uninstall — plus shellcheck on the shipped scripts.
#
# THE RULE: every new user-facing feature adds a stage/assertion here. If it
# can be observed headlessly (a file lands, a version changes, an endpoint
# answers), it gets a check. "Worked on my Mac once" is not coverage.
#
# Non-overlapping jobs:
#   macos-ota-e2e  — swap correctness: the .app version on disk actually
#                    changes after an OTA. Fast, pure Python, every PR to main.
#   macos-lifecycle— real postinstall as root: the root→user ownership handoff
#                    the swap depends on, then reinstall-over-top preserves data.
#   macos-uninstall— uninstall cleans everything AND refuses to run non-root.
#   linux-roundtrip— install.sh → assert layout → uninstall.sh → assert clean.
#   windows-headless-roundtrip — TEMPORARY, manual-only (workflow_dispatch) while
#                    the detached-cleanup uninstall is being fixed, so a known-red
#                    Windows uninstall doesn't block PRs. Validates: install.ps1 →
#                    Scheduled Task running → the binary's own uninstall kills every
#                    process, deletes the task, removes every artifact. Re-enable on
#                    PRs (and remove) once the Windows uninstall path is confirmed.
#   shellcheck     — static analysis of every shipped shell script.
#
# Can't run headless (track as manual pre-release checks): companion tray/WebKit
# UI, `launchctl kickstart gui/$uid` picking up the new binary, OAuth + device
# registration against live Control, notarized .pkg double-click Gatekeeper.
#
# Runs on every PR to main (and push to main) — the point is to block a
# regression before it merges, not to find it post-merge when the damage is done.

name: E2E

on:
  workflow_dispatch:
  # PR-only: e2e's job is to catch regressions before merge; the post-merge run
  # tested identical code (main does not move under an open PR here).
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Linux-first gating: the three macOS jobs (10x) and the Windows job (2x)
# `needs:` the cheap ubuntu jobs (linux-roundtrip + shellcheck). If a shipped
# script fails shellcheck or the Linux install/uninstall roundtrip breaks, no
# macOS/Windows minutes are spent. This is the same "cheap OS gates the
# expensive OS" pattern as ci.yml; it stays within this workflow because
# `needs:` can't cross workflow files.
jobs:
  # Path filter: docs / workflow / licence / image-only PRs skip the macOS
  # trio (a job skipped via `if:` reports "skipped" = success for branch
  # protection). Any other changed file flips `code` true. Non-PR events always
  # run everything. Same detector as ci.yml.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "non-PR event — running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed: if change detection errors or finds nothing, run the
          # full suite rather than silently skip it.
          if ! FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD") || [ -z "$FILES" ]; then
            echo "path detection failed or empty — running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"; echo "$FILES"
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|LICENSE*|docs/*|.github/*|*.png|*.jpg|*.jpeg|*.gif|*.svg|*.ico) ;;
              *) code=true ;;
            esac
          done <<< "$FILES"
          echo "relevant code changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Swap correctness — every PR to main. Real .app swap on a macOS runner,
  # asserting the on-disk version changed (the one thing no mocked test proves).
  macos-ota-e2e:
    name: macOS OTA e2e
    needs: [changes, linux-roundtrip, shellcheck]
    if: needs.changes.outputs.code == 'true' && github.actor != 'dependabot[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install project
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: OTA e2e (real .app swap)
        shell: bash
        env:
          DEVICE_MODE: "LOCAL"
        run: uv run pytest tests/test_ota_e2e_macos.py -v -m ci

  # Real install ownership + reinstall data-preservation.
  macos-lifecycle:
    name: macOS install → reinstall
    needs: [changes, linux-roundtrip, shellcheck]
    if: needs.changes.outputs.code == 'true' && github.actor != 'dependabot[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install project
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Stage a v1.0.0 payload (what the .pkg lays down)
        shell: bash
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/pkg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/versions/1.0.0" "$STAGING/LaunchAgents"
          printf '#!/bin/sh\nexit 0\n' > "$STAGING/versions/1.0.0/locai-link-runtime"
          chmod 755 "$STAGING/versions/1.0.0/locai-link-runtime"
          uv run python bundling/_ota_lifecycle.py manifest "$STAGING/versions/1.0.0/manifest.json" 1.0.0 c-v1
          ln -s versions/1.0.0 "$STAGING/current"
          # The merged binary lives inside the .app (Contents/MacOS/locai-link);
          # there is no standalone launcher in the payload.
          uv run python bundling/_ota_lifecycle.py app "$STAGING/Locai Link.app" 1.0.0 locai-link companion-v1
          echo '{"channel":"prod"}' > "$STAGING/boot.json"
          cp bundling/pkg/uninstall.sh "$STAGING/uninstall.sh"
          chmod 755 "$STAGING/uninstall.sh"
          cp bundling/pkg/LaunchAgents/*.plist "$STAGING/LaunchAgents/"
          echo "STAGING=$STAGING" >> "$GITHUB_ENV"

      - name: Install — run the real postinstall as root
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /Library/Locai
          sudo cp -R "$STAGING/." /Library/Locai/
          # Seed a pre-merge Setup Assistant (both copies) so we can assert
          # postinstall's LEGACY-SA-CLEANUP removes it.
          sudo mkdir -p "/Library/Locai/Setup Assistant.app/Contents"
          sudo mkdir -p "/Applications/Locai Setup Assistant.app/Contents"
          # pkgbuild passes ($1 pkg, $2 dest, $3 volume, $4 root); SUDO_USER is
          # how postinstall learns which user to hand writable state to.
          sudo SUDO_USER="$USER" bash bundling/pkg/scripts/postinstall / / / /

      - name: Assert ownership + swap-readiness (the ownership bug's only test)
        shell: bash
        run: |
          set -euo pipefail
          me="$USER"
          owner() { stat -f '%Su' "$1"; }
          [ -f "/Library/Locai/Locai Link.app/Contents/MacOS/locai-link" ] || { echo "::error::merged binary missing from .app"; exit 1; }
          [ "$(owner /Library/Locai)" = "$me" ] || { echo "::error::install root not user-owned"; exit 1; }
          app="/Library/Locai/Locai Link.app"
          [ "$(owner "$app")" = "$me" ] || { echo "::error::companion not user-owned — OTA can't swap it"; exit 1; }
          # The precondition the swap needs: the user can actually write the bundle.
          touch "$app/.ci-write-test" || { echo "::error::companion not user-writable"; exit 1; }
          rm -f "$app/.ci-write-test"
          [ -d "/Applications/Locai Link.app" ] || { echo "::error::/Applications copy missing"; exit 1; }
          [ -e /usr/local/bin/locai ] || { echo "::error::CLI symlink missing"; exit 1; }
          # LEGACY-SA-CLEANUP: the pre-merge Setup Assistant seeded above is gone.
          [ ! -d "/Library/Locai/Setup Assistant.app" ] || { echo "::error::legacy SA (install root) not removed"; exit 1; }
          [ ! -d "/Applications/Locai Setup Assistant.app" ] || { echo "::error::legacy SA (/Applications) not removed"; exit 1; }
          echo "install ownership + swap-readiness + legacy cleanup OK"

      - name: Seed device data (models + session)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /Library/Locai/models /Library/Locai/configs
          echo "gguf" > /Library/Locai/models/test-model.gguf
          echo '{"device_id":"dev-123"}' > /Library/Locai/configs/session_test.json

      - name: Reinstall over-the-top with v1.1.0
        shell: bash
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/pkg-staging"
          uv run python bundling/_ota_lifecycle.py app "$STAGING/Locai Link.app" 1.1.0 locai-link companion-v2
          sudo cp -R "$STAGING/." /Library/Locai/
          sudo SUDO_USER="$USER" bash bundling/pkg/scripts/postinstall / / / /

      - name: Assert reinstall preserved data and refreshed the apps
        shell: bash
        run: |
          set -euo pipefail
          [ -f /Library/Locai/models/test-model.gguf ] || { echo "::error::model wiped by reinstall"; exit 1; }
          [ -f /Library/Locai/configs/session_test.json ] || { echo "::error::session wiped by reinstall"; exit 1; }
          v=$(uv run python bundling/_ota_lifecycle.py appversion "/Library/Locai/Locai Link.app")
          [ "$v" = "1.1.0" ] || { echo "::error::install-root companion not refreshed (got $v)"; exit 1; }
          v2=$(uv run python bundling/_ota_lifecycle.py appversion "/Applications/Locai Link.app")
          [ "$v2" = "1.1.0" ] || { echo "::error::/Applications companion not refreshed (got $v2)"; exit 1; }
          echo "reinstall preserved data and refreshed both app copies"

  # Uninstall cleans everything and refuses to run without root.
  macos-uninstall:
    name: macOS uninstall roundtrip
    needs: [changes, linux-roundtrip, shellcheck]
    if: needs.changes.outputs.code == 'true' && github.actor != 'dependabot[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Synthesise the install layout
        run: |
          set -euo pipefail
          sudo mkdir -p /Library/Locai
          # The merged binary lives inside the .app (no standalone launcher).
          sudo mkdir -p "/Library/Locai/Locai Link.app/Contents/MacOS"
          sudo touch "/Library/Locai/Locai Link.app/Contents/MacOS/locai-link"
          sudo chmod 755 "/Library/Locai/Locai Link.app/Contents/MacOS/locai-link"
          echo '{"channel":"prod"}' | sudo tee /Library/Locai/boot.json >/dev/null
          sudo cp bundling/pkg/uninstall.sh /Library/Locai/uninstall.sh
          sudo chmod 755 /Library/Locai/uninstall.sh
          sudo mkdir -p "/Library/Locai/Setup Assistant.app/Contents"
          sudo mkdir -p "/Library/Locai/LaunchAgents"
          sudo mkdir -p "/Library/Locai/logs" "/Library/Locai/state" "/Library/Locai/versions"
          sudo mkdir -p "/Applications/Locai Link.app/Contents"
          sudo mkdir -p "/Applications/Locai Setup Assistant.app/Contents"
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "/Library/Locai/Locai Link.app/Contents/MacOS/locai-link" /usr/local/bin/locai
          mkdir -p "$HOME/Library/LaunchAgents"
          touch "$HOME/Library/LaunchAgents/uk.co.locai.link.agent.plist"
          touch "$HOME/Library/LaunchAgents/uk.co.locai.link.companion.plist"
          for bid in uk.co.locai.link.companion uk.co.locai.link.setup-assistant; do
            mkdir -p "$HOME/Library/Caches/$bid"
            mkdir -p "$HOME/Library/WebKit/$bid"
            mkdir -p "$HOME/Library/HTTPStorages/$bid"
            touch    "$HOME/Library/Preferences/$bid.plist"
            mkdir -p "$HOME/Library/Saved Application State/$bid.savedState"
            mkdir -p "$HOME/Library/Application Support/$bid"
          done
          mkdir -p "$HOME/Library/Application Support/Locai"

      - name: Non-root uninstall must refuse and leave the system intact
        run: |
          set -uo pipefail
          if bash /Library/Locai/uninstall.sh; then
            echo "::error::uninstall.sh returned 0 as non-root — it must refuse to run"
            exit 1
          fi
          for p in \
            "/Library/Locai" \
            "/Library/Locai/uninstall.sh" \
            "/Applications/Locai Link.app" \
            "/Applications/Locai Setup Assistant.app" \
            "/usr/local/bin/locai"; do
            if [[ ! -e "$p" ]]; then
              echo "::error::$p was removed by a non-root uninstall — guard is broken"
              exit 1
            fi
          done
          echo "non-root uninstall refused cleanly"

      - name: Root uninstall runs
        run: sudo /Library/Locai/uninstall.sh

      - name: Assert nothing is left behind
        run: |
          set -uo pipefail
          fail=0
          check_gone() {
            if [[ -e "$1" ]]; then
              echo "::error::$1 still exists after uninstall"
              fail=1
            fi
          }
          check_gone "/Library/Locai"
          check_gone "/Applications/Locai Link.app"
          check_gone "/Applications/Locai Setup Assistant.app"
          check_gone "/usr/local/bin/locai"
          check_gone "$HOME/Library/LaunchAgents/uk.co.locai.link.agent.plist"
          check_gone "$HOME/Library/LaunchAgents/uk.co.locai.link.companion.plist"
          for bid in uk.co.locai.link.companion uk.co.locai.link.setup-assistant; do
            check_gone "$HOME/Library/Caches/$bid"
            check_gone "$HOME/Library/WebKit/$bid"
            check_gone "$HOME/Library/HTTPStorages/$bid"
            check_gone "$HOME/Library/Preferences/$bid.plist"
            check_gone "$HOME/Library/Saved Application State/$bid.savedState"
            check_gone "$HOME/Library/Application Support/$bid"
          done
          check_gone "$HOME/Library/Application Support/Locai"
          [[ $fail -eq 0 ]] || exit 1
          echo "root uninstall cleaned every path"

  # TEMPORARY (remove once the Windows uninstall path is confirmed good in
  # the field): the real headless build through the real installer and the
  # real uninstall. Every Windows uninstall bug so far lived in the interplay
  # (task resurrection, path-scoped kills, verbatim paths, the detached
  # cleanup script), so nothing here is synthesised: real frozen runtime,
  # real Scheduled Task, real `locai-link.exe uninstall`.
  windows-headless-roundtrip:
    name: Windows headless install + uninstall roundtrip
    needs: [changes, linux-roundtrip, shellcheck]
    # Manual-only (workflow_dispatch) while the detached-cleanup uninstall is being
    # fixed: run it from the Actions "Run workflow" button. A known-red Windows
    # uninstall shouldn't block PRs; an if:-skipped job reports success for branch protection.
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.code == 'true' && github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    env:
      TASK_NAME: uk.co.locai.link.headless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set install root
        # The runner context isn't available in job-level env; export the root
        # via GITHUB_ENV instead. Absolute + already canonical: the assertions
        # compare it against Get-Process .Path with -like, which never
        # resolves `..`.
        shell: pwsh
        run: '"LOCAI_INSTALL_ROOT=$env:RUNNER_TEMP\locai-e2e" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates

      - name: Install project
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Build headless bundle
        # No --prefetch: the shipped headless shape carries no engines, and the
        # lifecycle under test doesn't depend on the plugin set — one plugin
        # keeps the freeze fast.
        shell: bash
        run: uv run python bundling/build.py --shape headless --plugins language_model

      - name: Pack the install tarball
        shell: pwsh
        run: ./bundling/windows/pack.ps1 -Release

      - name: Stage a local release (stable name + checksums.txt)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p serve
          BUILT=$(ls dist/locai-link-headless-windows-*.tar.gz | head -1)
          cp "$BUILT" serve/locai-link-headless-windows-x64.tar.gz
          (cd serve && sha256sum locai-link-headless-windows-x64.tar.gz > checksums.txt)
          cat serve/checksums.txt

      - name: Install via the real installer
        # install.ps1's fetch is Invoke-WebRequest (no file:// in pwsh), so the
        # staged release is served over localhost — checksum verification and
        # extraction run exactly as they do in the field.
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList "-m","http.server","8043","--directory","serve" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          try {
            $env:LOCAI_HEADLESS_URL  = "http://127.0.0.1:8043/locai-link-headless-windows-x64.tar.gz"
            $env:LOCAI_CHECKSUMS_URL = "http://127.0.0.1:8043/checksums.txt"
            ./scripts/install.ps1
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Assert install landed and the service is running
        shell: pwsh
        run: |
          $root = $env:LOCAI_INSTALL_ROOT
          $fail = $false
          foreach ($p in @("locai-link.exe", "boot.json", "versions", "run-hidden.vbs", "locai.cmd", "logs")) {
            if (-not (Test-Path (Join-Path $root $p))) { Write-Host "::error::install.ps1 did not create $p under $root"; $fail = $true }
          }
          if (-not (Get-ScheduledTask -TaskName $env:TASK_NAME -ErrorAction SilentlyContinue)) {
            Write-Host "::error::scheduled task $env:TASK_NAME not registered"; $fail = $true
          }
          if ($fail) { exit 1 }
          # The task chain (wscript -> cmd -> exe) takes a moment; poll for the
          # service process, path-scoped to this install root.
          $proc = $null
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and -not $proc) {
            $proc = Get-Process -Name locai-link -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -like "$root*" }
            Start-Sleep -Seconds 2
          }
          if (-not $proc) {
            $state = (Get-ScheduledTask -TaskName $env:TASK_NAME).State
            Write-Host "::error::no locai-link.exe under $root after 90s (task state: $state)"
            $log = Join-Path $root "logs\service.log"
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            exit 1
          }
          Write-Host "service running: pid $(@($proc)[0].Id) at $(@($proc)[0].Path)"

      - name: Uninstall via the real binary, assert everything is gone
        # One step on purpose: the runner reaps a step's leftover descendant
        # processes when the step ends, which kills the detached cleanup
        # before it runs. Waiting in the same step observes the real behavior.
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP "locai-uninstall.log"
          # Only delete an existing log, and let a real removal failure fail the
          # step (pwsh runs with ErrorActionPreference=stop) rather than silently
          # leave a stale log that the wait/validation below would accept.
          if (Test-Path $log) { Remove-Item $log -Force }
          & (Join-Path $env:LOCAI_INSTALL_ROOT "locai-link.exe") uninstall
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::uninstall exited $LASTEXITCODE"; exit 1 }
          $root = $env:LOCAI_INSTALL_ROOT
          # File removal is handed to a detached cleanup script that deletes the
          # root before writing its log, so wait for both to settle.
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and ((Test-Path $root) -or -not (Test-Path $log))) {
            Start-Sleep -Seconds 2
          }
          $fail = $false
          if (Test-Path $root) {
            Write-Host "::error::install root still present after 90s"
            Get-ChildItem $root -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            # Distinguish "cleanup never spawned" from "spawned but died":
            # the CLI writes the script before spawning it.
            $script = Join-Path $env:TEMP "locai-uninstall.ps1"
            Write-Host "cleanup script present: $(Test-Path $script)"
            $ps = Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -like "*locai-uninstall*" }
            Write-Host "cleanup powershell alive: $([bool]$ps)"
            $fail = $true
          }
          if (Get-ScheduledTask -TaskName $env:TASK_NAME -ErrorAction SilentlyContinue) {
            Write-Host "::error::scheduled task still registered after uninstall"; $fail = $true
          }
          $left = Get-Process -Name locai-link, locai-link-runtime -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -like "$root*" }
          if ($left) {
            Write-Host "::error::processes still running after uninstall: $(($left | ForEach-Object { $_.Id }) -join ', ')"; $fail = $true
          }
          if (-not (Test-Path $log)) {
            Write-Host "::error::cleanup log missing at $log — detached cleanup never ran"; $fail = $true
          } else {
            $content = (Get-Content $log -Raw).Trim()
            Write-Host "cleanup log: $content"
            if ($content -notmatch 'removed=True leftoverProcs=0') {
              Write-Host "::error::cleanup script reported failure: $content"; $fail = $true
            }
          }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -like "*$root*") {
            Write-Host "::error::install root still on the user PATH"; $fail = $true
          }
          if ($fail) { exit 1 }
          Write-Host "uninstall removed the task, every process, and every artifact"

  linux-roundtrip:
    name: Linux install + uninstall roundtrip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Synthesise a tarball-shaped bundle
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/locai-bundle"
          mkdir -p "$STAGE/bundle" "$STAGE/systemd" "$STAGE/applications" "$STAGE/icons"
          cat > "$STAGE/bundle/locai-link" <<'EOF'
          #!/bin/bash
          exit 0
          EOF
          chmod 755 "$STAGE/bundle/locai-link"
          cat > "$STAGE/bundle/manifest.json" <<'EOF'
          {"version":"0.0.0-smoke","asset_name":"smoke","plugins":[]}
          EOF
          echo '{"channel":"prod"}' > "$STAGE/boot.json"
          cp bundling/linux/systemd/locai-link-companion.service "$STAGE/systemd/"
          cp bundling/linux/applications/locai-link.desktop "$STAGE/applications/"
          python3 - <<'PY' "$STAGE/icons"
          import base64, os, sys
          out = sys.argv[1]
          png = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="
          )
          for name in ("32x32.png", "128x128.png", "128x128@2x.png"):
              with open(os.path.join(out, name), "wb") as f:
                  f.write(png)
          PY
          cp bundling/linux/install.sh   "$STAGE/install.sh"
          cp bundling/linux/uninstall.sh "$STAGE/uninstall.sh"
          chmod 755 "$STAGE/install.sh" "$STAGE/uninstall.sh"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Run install.sh
        run: |
          set -euo pipefail
          export LOCAI_INSTALL_ROOT="$RUNNER_TEMP/locai-install"
          echo "LOCAI_INSTALL_ROOT=$LOCAI_INSTALL_ROOT" >> "$GITHUB_ENV"
          # Seed pre-merge artifacts so we can assert install.sh's
          # LEGACY-SA-CLEANUP sweeps them.
          mkdir -p "$LOCAI_INSTALL_ROOT" "$HOME/.local/share/applications"
          touch "$LOCAI_INSTALL_ROOT/setup-assistant"
          touch "$HOME/.local/share/applications/locai-setup-assistant.desktop"
          bash "$STAGE/install.sh"

      - name: Assert install landed
        run: |
          set -uo pipefail
          fail=0
          check_present() {
            if [[ ! -e "$1" ]]; then
              echo "::error::install.sh did not create $1"
              fail=1
            fi
          }
          check_gone() {
            if [[ -e "$1" ]]; then
              echo "::error::install.sh left legacy artefact $1"
              fail=1
            fi
          }
          check_present "$LOCAI_INSTALL_ROOT/locai-link"
          check_present "$LOCAI_INSTALL_ROOT/boot.json"
          check_present "$LOCAI_INSTALL_ROOT/uninstall.sh"
          check_present "$LOCAI_INSTALL_ROOT/systemd/locai-link-companion.service"
          check_present "$HOME/.local/share/applications/locai-link.desktop"
          check_present "$HOME/.local/share/icons/hicolor/32x32/apps/locai-link.png"
          check_present "$HOME/.local/share/icons/hicolor/128x128/apps/locai-link.png"
          # LEGACY-SA-CLEANUP: the seeded pre-merge artefacts are swept.
          check_gone "$LOCAI_INSTALL_ROOT/setup-assistant"
          check_gone "$HOME/.local/share/applications/locai-setup-assistant.desktop"
          if grep -q "@HOME@" "$HOME/.local/share/applications/locai-link.desktop"; then
            echo "::error::@HOME@ sentinel survived into installed .desktop file"
            fail=1
          fi
          [[ $fail -eq 0 ]] || exit 1
          echo "install.sh laid out every expected artefact"

      - name: Run uninstall.sh
        run: bash "$LOCAI_INSTALL_ROOT/uninstall.sh"

      - name: Assert uninstall cleaned up
        run: |
          set -uo pipefail
          fail=0
          check_gone() {
            if [[ -e "$1" ]]; then
              echo "::error::$1 still exists after uninstall.sh"
              fail=1
            fi
          }
          check_gone "$LOCAI_INSTALL_ROOT"
          check_gone "$HOME/.local/share/applications/locai-link.desktop"
          check_gone "$HOME/.local/share/applications/locai-setup-assistant.desktop"
          check_gone "$HOME/.local/share/icons/hicolor/32x32/apps/locai-link.png"
          check_gone "$HOME/.local/share/icons/hicolor/128x128/apps/locai-link.png"
          [[ $fail -eq 0 ]] || exit 1
          echo "uninstall.sh cleaned every path install.sh created"

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint scripts
        run: |
          shellcheck --severity=warning \
            bundling/pkg/scripts/postinstall \
            bundling/pkg/uninstall.sh \
            bundling/linux/install.sh \
            bundling/linux/uninstall.sh \
            bundling/linux/pack.sh
