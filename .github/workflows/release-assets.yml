# Release-assets workflow — builds the cross-platform bundles and attaches
# them to the matching GitHub Release.
#
# Triggers:
#   1. `release: types: [created, published]` — fires automatically after
#      release.yml's action-gh-release@v2 creates the empty Release. Note
#      this only works if RELEASE_TOKEN is a personal access token (not
#      the default GITHUB_TOKEN), because GitHub Actions deliberately
#      skips triggering further workflows from default-token actions.
#   2. `workflow_dispatch` — manual override / re-run, e.g. to add bundles
#      to an existing Release that was created without them. Required when
#      RELEASE_TOKEN is GITHUB_TOKEN-equivalent and the chain doesn't fire
#      automatically.
#
# Output: each OS gets a versioned archive (.tar.gz on macOS/Linux, .zip on
# Windows) plus a .sha256 sidecar. macOS archives are signed + notarised
# + stapled when the six Apple secrets are configured; missing secrets are
# a hard error here because we don't want to publicly publish an unsigned
# macOS Release.

name: Release Assets

on:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach bundles to (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            asset_basename: locai-link-linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            python: "3.11"
            asset_basename: locai-link-windows-x86_64
            archive_ext: zip
          - os: macos-latest
            python: "3.11"
            # GitHub-hosted macos-latest is arm64; x86_64 needs a separate
            # runner (`macos-13`) when we choose to add Intel support.
            asset_basename: locai-link-macos-arm64
            archive_ext: tar.gz

    steps:
      - name: Resolve target tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # release event → use the release's tag; workflow_dispatch → use the input.
          if [ -n "$INPUT_TAG" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ -n "$RELEASE_TAG" ]; then
            echo "name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No tag resolved from event payload or workflow input."
            exit 1
          fi

      - name: Checkout repository at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache prefetched native binaries
        uses: actions/cache@v4
        with:
          path: bundling/_artifacts
          key: bundle-artifacts-${{ runner.os }}-${{ hashFiles('plugins/*/install.py') }}
          restore-keys: |
            bundle-artifacts-${{ runner.os }}-

      - name: Sync project + dev deps
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Build bundle
        shell: bash
        run: uv run python bundling/build.py --plugins language_model audio_transcriber

      # macOS signing block — same logic as bundle.yml. On a release we
      # treat missing secrets as a hard error rather than skipping; we
      # don't want to publicly ship an unsigned macOS binary.
      - name: Check macOS signing secrets present
        if: runner.os == 'macOS'
        id: sign_check
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          if [ -n "$APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64" ] \
             && [ -n "$APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD" ] \
             && [ -n "$APPLE_DEVELOPER_ID_APPLICATION" ] \
             && [ -n "$APPLE_NOTARY_KEY_ID" ] \
             && [ -n "$APPLE_NOTARY_ISSUER_ID" ] \
             && [ -n "$APPLE_NOTARY_KEY_P8_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::macOS signing secrets not configured — refusing to publish an unsigned macOS release. Configure secrets in repo settings before tagging."
            exit 1
          fi

      - name: Import signing cert into ephemeral keychain
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

      - name: Write notary API key
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "APPLE_NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Sign + notarise bundle (macOS)
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: uv run python bundling/sign_macos.py --bundle dist/locai-link

      - name: Wipe ephemeral keychain + notary key
        if: always() && runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" || true

      # Package the bundle into a single archive end users can download.
      # The asset name embeds the tag so multiple versions can coexist
      # locally; the .sha256 sidecar lets users verify the download.
      - name: Package bundle
        shell: bash
        # All vars in one env block — the prior version had two separate
        # `env:` keys which is invalid YAML and GitHub rejected the file
        # at parse time. ARCHIVE_EXT drives the if/else (tar vs zip),
        # ASSET is the full filename used by both the archive step and
        # the Python heredoc (env-passed so the heredoc subprocess sees it).
        env:
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          ASSET: ${{ matrix.asset_basename }}-${{ steps.tag.outputs.name }}.${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cd dist
          if [ "${ARCHIVE_EXT}" = "zip" ]; then
            # 7z preserves the locai-link/ parent dir and ships with the
            # windows-latest runner; deterministic enough for users.
            7z a -tzip -mx=9 "../release-assets/${ASSET}" locai-link
          else
            tar -czf "../release-assets/${ASSET}" locai-link
          fi
          cd ..
          # Cross-platform sha256 via Python — sha256sum is present on
          # Linux/Windows-Git-Bash but macOS only ships `shasum -a 256`.
          # Python is already on PATH from setup-python so this avoids
          # a tool-availability branch.
          python - <<'EOF' > "release-assets/${ASSET}.sha256"
          import hashlib, os, pathlib
          name = os.environ["ASSET"]
          p = pathlib.Path("release-assets") / name
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          print(f"{digest}  {name}")
          EOF
          ls -lah release-assets/

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  attach:
    name: Attach assets to Release
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve target tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ -n "$RELEASE_TAG" ]; then
            echo "name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No tag resolved."
            exit 1
          fi

      - name: Download all platform assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets/
          pattern: release-assets-*
          merge-multiple: true

      - name: List collected assets
        shell: bash
        run: ls -lah release-assets/

      - name: Attach bundles to existing Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          # action-gh-release@v2 updates the existing release with this tag
          # (created earlier by release.yml) rather than creating a new one.
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
          fail_on_unmatched_files: true
