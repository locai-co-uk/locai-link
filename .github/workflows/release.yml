name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-attach assets to (leave blank to create a new release from pyproject.toml)"
        required: false
        type: string
      dry_run:
        description: "Build the .pkg / .tar.gz / .zip but skip the release-create + asset-attach steps. Bundles are still uploaded to the workflow run as artifacts (14-day retention)."
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

# Default to read-only. Only the jobs that actually mutate the release
# (`release` creates the tag, `attach` uploads built assets) get write.
permissions:
  contents: read

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Symbolic label for asset filenames — "v1.0.19" or the dispatch-input tag.
      tag: ${{ steps.tag.outputs.name }}
      # Actual git ref bundle jobs check out. On dry_run this is the commit
      # SHA (the tag hasn't been minted); on real releases it's the tag,
      # which by then softprops has created.
      checkout_ref: ${{ steps.tag.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            NAME="$INPUT_TAG"
          else
            VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            NAME="v$VERSION"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          # On dry_run we don't create the tag, so bundle jobs must check out
          # the workflow's commit SHA instead — otherwise `git fetch v1.0.19`
          # fails ("A branch or tag with the name 'v1.0.19' could not be found").
          if [ "$DRY_RUN" = "true" ]; then
            echo "checkout_ref=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=$NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        # Build the full release body: a "What's Changed" heading, the curated
        # bullet summary from the version's CHANGELOG.md entry, and a Full
        # Changelog link to CHANGELOG.md. generate_release_notes is off (below), so
        # GitHub does not append its own PR-title list. Warn, don't fail, if the
        # entry is missing, so a release is never blocked on the changelog.
        id: notes
        if: inputs.tag == '' && !inputs.dry_run
        env:
          TAG: ${{ steps.tag.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          OUT="$RUNNER_TEMP/release-notes.md"
          python3 - "$VERSION" "$OUT" "$TAG" "$REPO" <<'PY'
          import pathlib, re, sys
          version, out, tag, repo = sys.argv[1:5]
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          hdr = re.compile(r"^##\s*\[" + re.escape(version) + r"\]")
          start = next((i + 1 for i, ln in enumerate(lines) if hdr.match(ln)), None)
          summary: list[str] = []
          if start is not None:
              for ln in lines[start:]:
                  if re.match(r"^###?\s", ln):  # next ## version or ### section ends the summary
                      break
                  summary.append(ln)
          body = "\n".join(summary).strip()
          if not body:
              print(f"::warning::No CHANGELOG.md summary for {version}; release notes will have no bullets")
          parts = ["## What's Changed"]
          if body:
              parts.append(body)
          parts.append(f"**Full Changelog**: https://github.com/{repo}/blob/{tag}/CHANGELOG.md")
          pathlib.Path(out).write_text("\n\n".join(parts) + "\n", encoding="utf-8")
          PY
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        # Skip when re-attaching to an existing release (workflow_dispatch
        # with tag input), and skip entirely when dry_run is true — dry-run
        # builds go to workflow-run artifacts, not to a release.
        if: inputs.tag == '' && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Release ${{ steps.tag.outputs.name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
          draft: false
          make_latest: true

  bundle:
    name: Bundle on ${{ matrix.os }}
    needs: release
    runs-on: ${{ matrix.os }}
    # Release channel — baked into the Tauri frontends via VITE_CHANNEL at
    # build time. Shows in the SA sidebar as "· Alpha - Build" (or Beta,
    # etc.). Set to "prod" (or empty) to hide the label when going GA.
    env:
      VITE_CHANNEL: alpha
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_tag: linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            platform_tag: windows-x86_64
            archive_ext: zip
          - os: macos-latest
            # GitHub-hosted macos-latest is arm64; x86_64 needs a separate runner.
            platform_tag: macos-arm64
            archive_ext: tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          # `checkout_ref` is the tag on a real release, or the commit SHA
          # on dry_run (when the tag hasn't been minted).
          ref: ${{ needs.release.outputs.checkout_ref }}

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Sync deps
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Build bundle
        shell: bash
        run: uv run python bundling/build.py --plugins language_model audio_transcriber

      - name: Read asset basename from manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          ASSET_BASE=$(python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("dist/locai-link")
          manifest = root / "current" / "manifest.json"
          if not manifest.exists():
              manifest = next(iter(root.glob("versions/*/manifest.json")), None)
              if manifest is None:
                  sys.exit(f"::error::No manifest.json under {root} (checked current/ and versions/*)")
          print(json.load(manifest.open())["asset_name"])
          PY
          )
          echo "asset_base=$ASSET_BASE" >> "$GITHUB_OUTPUT"
          echo "Asset basename: $ASSET_BASE"

      - name: Check macOS signing secrets
        if: runner.os == 'macOS'
        id: sign_check
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          # We need BOTH signing identities on macOS:
          #   - Developer ID Application → codesign the .app / Mach-O binaries.
          #   - Developer ID Installer   → productsign the outer .pkg.
          # Missing either means we can't publish a usable macOS release.
          if [ -n "$APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64" ] \
             && [ -n "$APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD" ] \
             && [ -n "$APPLE_DEVELOPER_ID_APPLICATION" ] \
             && [ -n "$APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64" ] \
             && [ -n "$APPLE_DEVELOPER_ID_INSTALLER_CERT_PASSWORD" ] \
             && [ -n "$APPLE_DEVELOPER_ID_INSTALLER" ] \
             && [ -n "$APPLE_NOTARY_KEY_ID" ] \
             && [ -n "$APPLE_NOTARY_ISSUER_ID" ] \
             && [ -n "$APPLE_NOTARY_KEY_P8_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::macOS signing secrets missing — refusing to publish an unsigned macOS release."
            exit 1
          fi

      - name: Import signing certs into ephemeral keychain
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          APP_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 }}
          APP_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          APP_CERT="$RUNNER_TEMP/app-cert.p12"
          INSTALLER_CERT="$RUNNER_TEMP/installer-cert.p12"
          echo "$APP_P12_BASE64" | base64 --decode > "$APP_CERT"
          echo "$INSTALLER_P12_BASE64" | base64 --decode > "$INSTALLER_CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Both p12s land in the same ephemeral keychain. -A allows any
          # tool to access them (codesign, productsign) without a
          # per-tool prompt; the partition-list step below is what
          # actually authorises tools once the keychain is unlocked.
          security import "$APP_CERT" -P "$APP_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERT" -P "$INSTALLER_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Wipe the p12 files immediately — the keychain has what it
          # needs and the base64 secrets shouldn't live on disk longer
          # than necessary.
          rm -f "$APP_CERT" "$INSTALLER_CERT"

      - name: Write notary API key
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "APPLE_NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Set up Node (for Tauri app builds)
        if: runner.os == 'macOS' || runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tauri Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Stamp UI app versions
        # Tauri's config version defaults to a static 0.1.0. Stamp it from
        # pyproject (the same source the runtime manifest uses) so the installed
        # .app version matches the runtime version. The updater uses that match
        # to detect a stale UI after an OTA that couldn't swap the apps.
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_bytes().decode())['project']['version'])")"
          conf=crates/link/src-tauri/tauri.conf.json
          python3 -c "import json,sys,pathlib; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); d['version']=sys.argv[2]; p.write_text(json.dumps(d,indent=2)+chr(10))" "$conf" "$VERSION"
          echo "stamped UI app version to $VERSION"

      - name: Build companion binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: crates/link
        run: |
          set -euo pipefail
          npm ci
          npm run tauri build -- --no-bundle

      - name: Build companion .app (macOS)
        # `tauri build` invokes the frontend build (npm run build) first via
        # tauri.conf.json's beforeBuildCommand, then compiles the Rust side.
        # Companion's productName is "Locai Link" (with space) so its .app
        # basename is "Locai Link.app" — exactly what we want in /Applications
        # as the user-facing entry point. Output lands under
        # crates/target/release/bundle/macos/.
        if: runner.os == 'macOS'
        shell: bash
        working-directory: crates/link
        run: |
          set -euo pipefail
          npm ci
          npm run tauri build -- --bundles app

      - name: Codesign companion .app (macOS)
        # allow-jit is the only relaxation the WebKit view needs
        # (crates/link/src-tauri/entitlements.plist). If the app needs
        # different entitlements later (e.g. Login Items via SMAppService),
        # extend that file.
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
        shell: bash
        run: |
          set -euo pipefail
          COMPANION_APP=$(find crates/target/release/bundle/macos -maxdepth 2 -type d -iname "Locai Link.app" | head -n 1)
          if [ -z "$COMPANION_APP" ]; then
            echo "::error::companion .app (Locai Link.app) not found after tauri build"
            exit 1
          fi
          echo "Signing $COMPANION_APP"
          uv run python bundling/sign_macos.py \
            --bundle "$COMPANION_APP" \
            --entitlements crates/link/src-tauri/entitlements.plist \
            --skip-notarise
          echo "COMPANION_APP_PATH=$COMPANION_APP" >> "$GITHUB_ENV"

      - name: Notarise + staple UI .app bundles (macOS)
        # The OTA tarball ships these .apps directly, not inside the .pkg,
        # so they each need their own stapled ticket to stay Gatekeeper-clean
        # when swapped in. Notarise both in one submission, then staple the
        # source paths in place; the .pkg and OTA legs below copy the stapled apps.
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          NOTARY_DIR="$RUNNER_TEMP/notary-apps"
          rm -rf "$NOTARY_DIR"
          mkdir -p "$NOTARY_DIR"
          cp -R "$COMPANION_APP_PATH" "$NOTARY_DIR/"

          # Zip both apps into one submission (notarytool notarises all
          # nested code; stapler then resolves each app's ticket by cdhash).
          APPS_ZIP="$RUNNER_TEMP/ota-apps.zip"
          ditto -c -k --keepParent "$NOTARY_DIR" "$APPS_ZIP"
          xcrun notarytool submit "$APPS_ZIP" \
            --key "$APPLE_NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait

          # Staple the originals (same cdhash as the submitted copies), so
          # every downstream copy carries the ticket. Validate hard-fails
          # the build if the ticket didn't attach.
          xcrun stapler staple "$COMPANION_APP_PATH"
          xcrun stapler validate "$COMPANION_APP_PATH"

      - name: Codesign runtime bundle (macOS)
        # Signs the Python runtime tree (dist/locai-link/) but skips
        # notarisation — the outer .pkg gets notarised end-to-end
        # below, and Apple's notarisation ticket propagates to everything
        # inside the .pkg on stapling.
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
        run: uv run python bundling/sign_macos.py --bundle dist/locai-link --skip-notarise

      - name: Build + notarise .pkg (macOS)
        # pkgbuild → productbuild → productsign → notarytool → stapler.
        # See bundling/pkg/README.md for the reference sequence; this
        # step is the CI mirror of those commands.
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          TAG: ${{ needs.release.outputs.tag }}
          ASSET_BASE: ${{ steps.manifest.outputs.asset_base }}
        shell: bash
        run: |
          set -euo pipefail

          # 1. Assemble the payload tree under /Library/Locai (the
          #    postinstall's expected layout).
          STAGING="$RUNNER_TEMP/pkg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          # The Python runtime tree — copy the whole dist/locai-link/
          # directory contents into the staging root. This mirrors what
          # `.pkg --root` will lay down on the target.
          cp -R dist/locai-link/. "$STAGING/"

          # boot.json — canonical production channel config. plugin_set is
          # injected from the bundle manifest so the launcher's first-launch
          # fetch targets the asset this build actually is.
          python3 bundling/gen_boot_json.py \
            --manifest "$STAGING/current/manifest.json" \
            --template bundling/pkg/boot.json \
            --output "$STAGING/boot.json"

          # Companion menubar .app — the user-facing "Locai Link" in
          # /Applications post-install (postinstall symlinks it there). Also
          # hosts the first-run setup window.
          cp -R "$COMPANION_APP_PATH" "$STAGING/Locai Link.app"

          # App content hash for whole-app OTA: record the companion source
          # hash in the manifest so swap_bundle re-swaps it only when changed.
          python3 bundling/inject_app_hashes.py \
            --manifest "$STAGING/current/manifest.json" --repo-root .

          # LaunchAgent plist — bundled but NOT bootstrapped at
          # install time. The app registers it on Finish (always) and
          # toggles RunAtLoad based on the "Start at login" checkbox on the
          # setup wizard's Permissions step. One unit: the merged binary
          # supervises the runtime in-process.
          mkdir -p "$STAGING/LaunchAgents"
          cp bundling/pkg/LaunchAgents/uk.co.locai.link.companion.plist \
             "$STAGING/LaunchAgents/uk.co.locai.link.companion.plist"

          # Uninstaller script — invoked from the companion tray menu
          # ("Uninstall Locai Link…") via osascript with admin
          # privileges, and by any user with `sudo /Library/Locai/uninstall.sh`
          # from Terminal. postinstall re-chmods 755 defensively.
          cp bundling/pkg/uninstall.sh "$STAGING/uninstall.sh"
          chmod 755 "$STAGING/uninstall.sh"

          # 2. Version-stamp Distribution.xml. The skeleton ships
          #    "0.0.0" as a placeholder; productbuild wants the real
          #    version so users see it in the wizard header.
          #    TAG is like "v1.0.17" — strip leading "v" for the pkg-ref.
          VERSION="${TAG#v}"
          DIST_XML="$RUNNER_TEMP/Distribution.xml"
          sed "s/version=\"0.0.0\"/version=\"$VERSION\"/" \
            bundling/pkg/Distribution.xml > "$DIST_XML"
          # Guard against silent no-op if the placeholder in the source XML
          # ever drifts — otherwise we ship a .pkg still labelled 0.0.0.
          if ! grep -q "version=\"$VERSION\"" "$DIST_XML"; then
            echo "::error::Failed to stamp version into Distribution.xml"
            exit 1
          fi

          # 3. Build the component .pkg with the postinstall wired in.
          COMPONENT_PKG="$RUNNER_TEMP/locai-link-runtime.pkg"
          pkgbuild \
            --root "$STAGING" \
            --scripts bundling/pkg/scripts \
            --install-location /Library/Locai \
            --identifier uk.co.locai.link.runtime \
            --version "$VERSION" \
            "$COMPONENT_PKG"

          # 4. Wrap in the distribution .pkg with the wizard UI.
          #    productbuild references locai-link-runtime.pkg relative
          #    to --package-path.
          UNSIGNED_PKG="$RUNNER_TEMP/Locai-Link-unsigned.pkg"
          productbuild \
            --distribution "$DIST_XML" \
            --package-path "$RUNNER_TEMP" \
            --resources bundling/pkg \
            "$UNSIGNED_PKG"

          # 5. Sign the outer .pkg with the Installer cert.
          SIGNED_PKG="$RUNNER_TEMP/Locai-Link.pkg"
          productsign \
            --sign "$APPLE_DEVELOPER_ID_INSTALLER" \
            "$UNSIGNED_PKG" \
            "$SIGNED_PKG"
          rm -f "$UNSIGNED_PKG"

          # 6. Notarise via App Store Connect API key + block until
          #    Apple's servers finish (typically 3–10 minutes; longer
          #    on bad days).
          xcrun notarytool submit "$SIGNED_PKG" \
            --key "$APPLE_NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait

          # 7. Staple the notarisation ticket so the .pkg works
          #    offline on first-run.
          xcrun stapler staple "$SIGNED_PKG"

          # 8. Copy into release-assets/ with a name matching the
          #    ${asset_base}-${platform}-${TAG}.${ext} pattern used by
          #    the tar.gz / zip legs so all release assets look uniform.
          mkdir -p release-assets
          FINAL_NAME="${ASSET_BASE}-macos-arm64-${TAG}.pkg"
          cp "$SIGNED_PKG" "release-assets/$FINAL_NAME"

          python - <<EOF > "release-assets/${FINAL_NAME}.sha256"
          import hashlib, pathlib
          p = pathlib.Path("release-assets/${FINAL_NAME}")
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          print(f"{digest}  ${FINAL_NAME}")
          EOF

          # Stable-named copy for the permanent "latest" download URL.
          # Version- and plugin-agnostic so the URL never changes across releases:
          #   .../releases/latest/download/locai-link-macos-arm64.pkg
          # Assumes one canonical bundle per platform per release.
          STABLE_NAME="locai-link-macos-arm64.pkg"
          cp "$SIGNED_PKG" "release-assets/$STABLE_NAME"
          python - <<EOF > "release-assets/${STABLE_NAME}.sha256"
          import hashlib, pathlib
          p = pathlib.Path("release-assets/${STABLE_NAME}")
          print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  ${STABLE_NAME}")
          EOF

          # 9. OTA tarball. swap_bundle downloads this, not the .pkg. Whole-app
          #    OTA: include the runtime version payload AND the notarised +
          #    stapled .app bundles, so swap_bundle can replace changed UI apps too, not
          #    just the runtime. Named as the <stem>-macos-arm64-v<version>.tar.gz
          #    asset the updater resolves; without it macOS OTA loops on ReleaseNotFound.
          VERSION_DIR="$(python3 -c "import json; print(json.load(open('$STAGING/current/manifest.json'))['version'])")"
          if [ -z "$VERSION_DIR" ] || [ ! -d "$STAGING/versions/$VERSION_DIR" ]; then
            echo "::error::OTA payload versions/$VERSION_DIR not found under staging"
            exit 1
          fi
          OTA_ROOT="$RUNNER_TEMP/ota"
          rm -rf "$OTA_ROOT"
          mkdir -p "$OTA_ROOT/versions"
          cp -R "$STAGING/versions/$VERSION_DIR" "$OTA_ROOT/versions/$VERSION_DIR"
          cp -R "$STAGING/Locai Link.app"        "$OTA_ROOT/Locai Link.app"
          TAR_NAME="${ASSET_BASE}-macos-arm64-${TAG}.tar.gz"
          tar -czf "release-assets/$TAR_NAME" -C "$OTA_ROOT" .
          python - <<EOF > "release-assets/${TAR_NAME}.sha256"
          import hashlib, pathlib
          p = pathlib.Path("release-assets/${TAR_NAME}")
          print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  ${TAR_NAME}")
          EOF
          ls -lah release-assets/

      - name: Wipe ephemeral keychain + notary key
        if: always() && runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" || true

      - name: Package bundle (Linux — via pack.sh)
        # Ships the full pack.sh layout: frozen runtime + Tauri binaries +
        # boot.json + systemd units + .desktop + icons + install/uninstall.
        # The macOS leg publishes its .pkg + .pkg.sha256 upstream in the
        # build+notarise step; Windows uses the "Package bundle (Windows)"
        # step below to zip the frozen runtime.
        if: runner.os == 'Linux'
        shell: bash
        env:
          ASSET: ${{ steps.manifest.outputs.asset_base }}-${{ matrix.platform_tag }}-${{ needs.release.outputs.tag }}.${{ matrix.archive_ext }}
          STABLE: locai-link-${{ matrix.platform_tag }}.${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          bash bundling/linux/pack.sh --release --output "release-assets/${ASSET}"
          python - <<'EOF' > "release-assets/${ASSET}.sha256"
          import hashlib, os, pathlib
          name = os.environ["ASSET"]
          p = pathlib.Path("release-assets") / name
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          print(f"{digest}  {name}")
          EOF

          # Stable-named copy for the permanent "latest" download URL.
          cp "release-assets/${ASSET}" "release-assets/${STABLE}"
          python - <<'EOF' > "release-assets/${STABLE}.sha256"
          import hashlib, os, pathlib
          name = os.environ["STABLE"]
          p = pathlib.Path("release-assets") / name
          print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {name}")
          EOF
          ls -lah release-assets/

      - name: Package bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          ASSET: ${{ steps.manifest.outputs.asset_base }}-${{ matrix.platform_tag }}-${{ needs.release.outputs.tag }}.${{ matrix.archive_ext }}
          STABLE: locai-link-${{ matrix.platform_tag }}.${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cd dist
          7z a -tzip -mx=9 "../release-assets/${ASSET}" locai-link
          cd ..
          python - <<'EOF' > "release-assets/${ASSET}.sha256"
          import hashlib, os, pathlib
          name = os.environ["ASSET"]
          p = pathlib.Path("release-assets") / name
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          print(f"{digest}  {name}")
          EOF

          # Stable-named copy for the permanent "latest" download URL.
          cp "release-assets/${ASSET}" "release-assets/${STABLE}"
          python - <<'EOF' > "release-assets/${STABLE}.sha256"
          import hashlib, os, pathlib
          name = os.environ["STABLE"]
          p = pathlib.Path("release-assets") / name
          print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {name}")
          EOF
          ls -lah release-assets/

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  attach:
    name: Attach assets to release
    needs: [release, bundle]
    # Run even if one bundle matrix leg failed — the surviving legs
    # still produced usable artifacts and shouldn't be held hostage.
    # `release` still has to succeed (no tag = nothing to attach to).
    # Skip entirely on dry_run — bundles stay in the run's artifacts only.
    if: always() && needs.release.result == 'success' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          pattern: release-assets-*
          merge-multiple: true

      - name: List collected assets
        shell: bash
        run: ls -lah release-assets/ 2>/dev/null || echo "(no assets collected — all bundle legs failed)"

      - name: Generate checksums.txt
        # One release-wide checksum file (sha256sum format) over every real
        # asset. The updater and launcher prefer it; the per-asset .sha256
        # sidecars stay published until the fleet is past the transition
        # release, then their generation can be dropped.
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.pkg' \) -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -r sha256sum > checksums.txt
          cat checksums.txt

      - name: Attach bundles to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.pkg
            release-assets/*.sha256
            release-assets/checksums.txt
          # Don't abort the whole release when one platform's leg
          # failed to produce its artifact; the other platforms are
          # still worth publishing.
          fail_on_unmatched_files: false
