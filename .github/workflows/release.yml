name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-attach assets to (leave blank to create a new release from pyproject.toml)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

# Default to read-only. Only the jobs that actually mutate the release
# (`release` creates the tag, `attach` uploads built assets) get write.
permissions:
  contents: read

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            echo "name=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        # Skip when re-attaching to an existing release (workflow_dispatch with tag input).
        if: inputs.tag == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Release ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: false
          make_latest: true

  bundle:
    name: Bundle on ${{ matrix.os }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_tag: linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            platform_tag: windows-x86_64
            archive_ext: zip
          - os: macos-latest
            # GitHub-hosted macos-latest is arm64; x86_64 needs a separate runner.
            platform_tag: macos-arm64
            archive_ext: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache prefetched binaries
        uses: actions/cache@v6
        with:
          path: bundling/_artifacts
          key: bundle-artifacts-${{ runner.os }}-${{ hashFiles('plugins/*/install.py') }}
          restore-keys: |
            bundle-artifacts-${{ runner.os }}-

      - name: Sync deps
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Build bundle
        shell: bash
        run: uv run python bundling/build.py --plugins language_model audio_transcriber

      - name: Read asset basename from manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          ASSET_BASE=$(python -c "import json; print(json.load(open('dist/locai-link/manifest.json'))['asset_name'])")
          echo "asset_base=$ASSET_BASE" >> "$GITHUB_OUTPUT"
          echo "Asset basename: $ASSET_BASE"

      - name: Check macOS signing secrets
        if: runner.os == 'macOS'
        id: sign_check
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          if [ -n "$APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64" ] \
             && [ -n "$APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD" ] \
             && [ -n "$APPLE_DEVELOPER_ID_APPLICATION" ] \
             && [ -n "$APPLE_NOTARY_KEY_ID" ] \
             && [ -n "$APPLE_NOTARY_ISSUER_ID" ] \
             && [ -n "$APPLE_NOTARY_KEY_P8_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::macOS signing secrets missing — refusing to publish an unsigned macOS release."
            exit 1
          fi

      - name: Import signing cert into ephemeral keychain
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

      - name: Write notary API key
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "APPLE_NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Sign + notarise bundle (macOS)
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: uv run python bundling/sign_macos.py --bundle dist/locai-link

      - name: Wipe ephemeral keychain + notary key
        if: always() && runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" || true

      - name: Package bundle
        shell: bash
        env:
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          ASSET: ${{ steps.manifest.outputs.asset_base }}-${{ matrix.platform_tag }}-${{ needs.release.outputs.tag }}.${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cd dist
          if [ "${ARCHIVE_EXT}" = "zip" ]; then
            7z a -tzip -mx=9 "../release-assets/${ASSET}" locai-link
          else
            tar -czf "../release-assets/${ASSET}" locai-link
          fi
          cd ..
          python - <<'EOF' > "release-assets/${ASSET}.sha256"
          import hashlib, os, pathlib
          name = os.environ["ASSET"]
          p = pathlib.Path("release-assets") / name
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          print(f"{digest}  {name}")
          EOF
          ls -lah release-assets/

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  attach:
    name: Attach assets to release
    needs: [release, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          pattern: release-assets-*
          merge-multiple: true

      - name: List collected assets
        shell: bash
        run: ls -lah release-assets/

      - name: Attach bundles to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
          fail_on_unmatched_files: true
