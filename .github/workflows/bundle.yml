name: Build Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
    # Only run on PRs that touch bundling logic or things it depends on.
    paths:
      - "bundling/**"
      - "plugins/*/install.py"
      - "plugins/*/pyproject.toml"
      - "src/link/**"
      - "main.py"
      - "pyproject.toml"
      - ".github/workflows/bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Cache the prefetched native binaries + cmake build outputs.
      # Key on every plugin's install.py because the pinned upstream tags
      # (LLAMA_CPP_RELEASE, WHISPER_CPP_RELEASE) live there; bumping a tag
      # invalidates the cache and triggers a fresh prefetch/build.
      - name: Cache prefetched binaries
        uses: actions/cache@v4
        with:
          path: bundling/_artifacts
          key: bundle-artifacts-${{ runner.os }}-${{ hashFiles('plugins/*/install.py') }}
          restore-keys: |
            bundle-artifacts-${{ runner.os }}-

      - name: Sync project + dev deps
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Build bundle
        shell: bash
        run: uv run python bundling/build.py --plugins language_model audio_transcriber

      # macOS-only: sign + notarise + staple the bundle so end users (and
      # partner apps embedding it via Tauri externalBin) don't see Gatekeeper
      # warnings. Gated on the signing secrets being present so PRs from
      # forks — which don't get repo secrets — continue to produce an
      # unsigned bundle artefact rather than failing.
      - name: Check macOS signing secrets present
        if: runner.os == 'macOS'
        id: sign_check
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          if [ -n "$APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64" ] \
             && [ -n "$APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD" ] \
             && [ -n "$APPLE_DEVELOPER_ID_APPLICATION" ] \
             && [ -n "$APPLE_NOTARY_KEY_ID" ] \
             && [ -n "$APPLE_NOTARY_ISSUER_ID" ] \
             && [ -n "$APPLE_NOTARY_KEY_P8_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets not configured — skipping sign + notarise. Bundle will be unsigned."
          fi

      - name: Import signing cert into ephemeral keychain
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          # Random per-run keychain password — never persisted.
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"

          # Create an isolated keychain so we don't pollute the runner's
          # login keychain (matters for self-hosted runners; harmless here).
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Prepend our keychain to the search list so codesign finds the
          # identity before falling back to login.keychain.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT_PATH"

      - name: Write notary API key
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "APPLE_NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Sign + notarise bundle (macOS)
        if: runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: uv run python bundling/sign_macos.py --bundle dist/locai-link

      - name: Wipe ephemeral keychain + notary key
        if: always() && runner.os == 'macOS' && steps.sign_check.outputs.ready == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" || true

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: locai-link-${{ runner.os }}
          path: dist/locai-link
          if-no-files-found: error
          retention-days: 14
