name: Build Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
    # Only run on PRs that touch bundling logic or things it depends on.
    paths:
      - "bundling/**"
      - "plugins/*/install.py"
      - "plugins/*/pyproject.toml"
      - "src/link/**"
      - "main.py"
      - "pyproject.toml"
      - ".github/workflows/bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Cache the prefetched native binaries + cmake build outputs.
      # Key on every plugin's install.py because the pinned upstream tags
      # (LLAMA_CPP_RELEASE, WHISPER_CPP_RELEASE) live there; bumping a tag
      # invalidates the cache and triggers a fresh prefetch/build.
      - name: Cache prefetched binaries
        uses: actions/cache@v4
        with:
          path: bundling/_artifacts
          key: bundle-artifacts-${{ runner.os }}-${{ hashFiles('plugins/*/install.py') }}
          restore-keys: |
            bundle-artifacts-${{ runner.os }}-

      - name: Sync project + dev deps
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Build bundle
        shell: bash
        run: uv run python bundling/build.py --plugins language_model audio_transcriber

      # Note: macOS sign + notarise is intentionally NOT done here. This
      # workflow's purpose is build-validation on every PR + main push,
      # which should be fast (~5-8 min). Apple's notarisation queue
      # easily adds 15-25 minutes per run, and the signed artefact from
      # a non-release build serves no public purpose — workflow artefacts
      # require GitHub login to download and expire after 14 days.
      # Signing lives in release-assets.yml, gated on the `release: created`
      # event so it only runs when we're actually cutting a release.

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: locai-link-${{ runner.os }}
          path: dist/locai-link
          if-no-files-found: error
          retention-days: 14
