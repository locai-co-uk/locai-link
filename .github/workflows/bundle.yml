name: Build Bundle

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
    paths:
      - "bundling/**"
      - "!bundling/pkg/**"
      - "crates/companion/**"
      - "crates/shared/**"
      - "crates/Cargo.toml"
      - "plugins/*/install.py"
      - "plugins/*/pyproject.toml"
      - "src/link/**"
      - "main.py"
      - "pyproject.toml"
      - ".github/workflows/bundle.yml"

# Cancel superseded runs on the same PR; never cancel on main pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Linux-first gating: the ubuntu bundle runs first and the macOS (10x) +
# Windows (2x) bundles `needs:` it. A build break that shows on Linux skips the
# expensive runners instead of failing on all three in parallel.
#
# NOTE: the steps in bundle-linux and bundle-cross are intentionally identical —
# keep them in sync when editing either.
jobs:
  bundle-linux:
    name: Bundle on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain (for supervisor)
        uses: dtolnay/rust-toolchain@stable

      - name: Test supervisor (headless)
        shell: bash
        run: cargo test --manifest-path crates/companion/src-tauri/Cargo.toml --release --no-default-features

      - name: Sync project + dev deps
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Build bundle
        shell: bash
        run: uv run python bundling/build.py --plugins language_model audio_transcriber

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: locai-link-${{ runner.os }}
          path: dist/locai-link
          if-no-files-found: error
          retention-days: 14

  bundle-cross:
    name: Bundle on ${{ matrix.os }}
    needs: [bundle-linux]
    # Dependabot PRs validate the Linux bundle only; skip the macOS/Windows legs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Rust toolchain (for supervisor)
        uses: dtolnay/rust-toolchain@stable

      - name: Test supervisor (headless)
        shell: bash
        run: cargo test --manifest-path crates/companion/src-tauri/Cargo.toml --release --no-default-features

      - name: Sync project + dev deps
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Build bundle
        shell: bash
        run: uv run python bundling/build.py --plugins language_model audio_transcriber

      # Note: macOS sign + notarise is intentionally NOT done here. This
      # workflow's purpose is per-PR build-validation, which should be fast
      # (~5-8 min). Apple's notarisation queue
      # easily adds 15-25 minutes per run, and the signed artefact from
      # a non-release build serves no public purpose — workflow artefacts
      # require GitHub login to download and expire after 14 days.
      # Signing lives in release-assets.yml, gated on the `release: created`
      # event so it only runs when we're actually cutting a release.

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: locai-link-${{ runner.os }}
          path: dist/locai-link
          if-no-files-found: error
          retention-days: 14
