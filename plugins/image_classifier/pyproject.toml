[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "link-image-classifier"
version = "0.1.0"
description = "Image classification plugin for Loc.ai:Link"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.21.0",
    "opencv-python>=4.11.0",
    "pillow>=10.0.0",
    "requests>=2.32.4",
    "ai-edge-litert>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.0", "pytest-mock>=3.15.0"]

[project.entry-points."locai.plugins"]
image_classifier = "link_image_classifier.adapter:ImageClassifier"

[tool.hatch.build.targets.wheel]
packages = [] # Disable auto-discovery

[tool.hatch.build.targets.wheel.force-include]
"adapter.py" = "link_image_classifier/adapter.py"
"__init__.py" = "link_image_classifier/__init__.py"
