[package]
name = "locai-link-companion"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Locai Link menu-bar companion — tray icon + status + Models flyout."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The single shipped binary (supervisor + optional ui). Was the launcher's name;
# the launcher crate is folded in.
[[bin]]
name = "locai-link"
path = "src/main.rs"

[build-dependencies]
# Only invoked in `ui` builds (see build.rs); harmless as a build dep otherwise.
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Supervisor tests: tempdir install roots + a local HTTP stub serving a fake
# release for the bootstrap/self-swap integration tests. Run headless
# (`--no-default-features`); see tests/.
tempfile = "3.10"
mockito = "1.4"

[features]
# `ui` = the desktop app (tray + setup/preferences windows). Off = the headless
# supervisor binary: no Tauri/webkit deps, just the supervisor loop.
default = ["ui"]
ui = [
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-single-instance",
]

[dependencies]
# --- UI (desktop) only, gated behind `ui` ---
# `tray-icon` gives us TrayIconBuilder + native menu; `image-png` lets
# us load PNG bytes into a `tauri::image::Image` at build time so the
# tray icon isn't coupled to the app bundle's icon assets at runtime.
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
# Native quit-confirmation dialog. Tauri's own plugin marshals the dialog onto
# the correct (main) thread and event loop — rfd's sync GTK dialog doesn't
# display reliably from inside a Tauri app on Linux.
tauri-plugin-dialog = { version = "2", optional = true }
# Single-instance guard: a second launch focuses the running instance instead
# of spawning a duplicate tray icon.
tauri-plugin-single-instance = { version = "2", optional = true }
# --- shared across both builds ---
serde = { workspace = true }
serde_json = { workspace = true }
# Control-plane HTTP for onboarding (ui) + bootstrap download (supervisor).
ureq = { workspace = true }
locai-link-shared = { path = "../../shared" }
# Supervisor bootstrap: verify + extract the runtime tarball on first launch.
sha2 = "0.10"
tar = "0.4"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

