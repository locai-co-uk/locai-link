[package]
name = "locai-link-companion"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Locai Link menu-bar companion — tray icon + status + Models flyout."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` gives us TrayIconBuilder + native menu; `image-png` lets
# us load PNG bytes into a `tauri::image::Image` at build time so the
# tray icon isn't coupled to the app bundle's icon assets at runtime.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
locai-link-shared = { path = "../../shared" }
# Native quit-confirmation dialog. Tauri's own plugin marshals the dialog onto
# the correct (main) thread and event loop — rfd's sync GTK dialog doesn't
# display reliably from inside a Tauri app on Linux.
tauri-plugin-dialog = "2"
# Single-instance guard: a second launch (Dock/Launchpad, or a stale
# /Applications copy) focuses the running instance instead of spawning a
# duplicate tray icon.
tauri-plugin-single-instance = "2"

