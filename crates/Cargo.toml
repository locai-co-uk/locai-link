# Cargo workspace root. Members are the shared helper crate (agent-status
# polling, boot.json reading, version lookup) and the single locai-link binary
# (supervisor + optional ui).

[workspace]
resolver = "2"
members = [
    "shared",
    # The single Locai Link binary: supervisor + (with the `ui` feature) the tray
    # + first-run setup. `src-tauri/` houses the Rust backend; the Svelte frontend
    # lives alongside it under `src/`. The former standalone launcher is folded in.
    "companion/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false

# Shared dependency versions used by more than one member crate. Members
# pin against `{ workspace = true }` to keep the tree consistent.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["tls", "json", "gzip"] }

# Release profile applies to the whole workspace. The headless build targets a
# small static binary; tuning here keeps the Tauri builds small too.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
