# Cargo workspace root. Members are the launcher (existing), the shared
# helper crate (agent-status polling, boot.json reading, version lookup),
# and the two Tauri apps that drive the installer UX.

[workspace]
resolver = "2"
members = [
    "launcher",
    "shared",
    # Tauri apps. Each has a `src-tauri/` directory housing the Rust
    # backend; the Svelte frontend lives alongside it under `src/`.
    "setup_assistant/src-tauri",
    "companion/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false

# Shared dependency versions used by more than one member crate. Members
# pin against `{ workspace = true }` to keep the tree consistent.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["tls", "json", "gzip"] }

# Release profile applies to the whole workspace. The launcher targets a
# small static binary; tuning here keeps the Tauri builds small too.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
